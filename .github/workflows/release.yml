name: Release firmware

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { env: NerdminerV2,            name: NerdminerV2            }
          - { env: NerdminerV2-S3-AMOLED,  name: NerdminerV2-S3-AMOLED  }
          - { env: M5Stick-CPlus,          name: M5Stick-CPlus          }
          - { env: M5Stick-C-Plus2,        name: M5Stick-C-Plus2        }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.target.env }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.target.env }}
        run: pio run -e ${{ matrix.target.env }}

      - name: Locate merged firmware binary
        id: find
        run: |
          # post_build_merge.py generates a merged binary in the build output dir
          BIN=$(find .pio/build/${{ matrix.target.env }} -name "*merged*.bin" 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find .pio/build/${{ matrix.target.env }} -name "firmware.bin" 2>/dev/null | head -1)
          fi
          echo "bin=$BIN" >> $GITHUB_OUTPUT

      - name: Rename binary and generate SHA256 sidecar
        run: |
          TAG="${{ github.ref_name }}"
          DEST="NerdMinerAI-${{ matrix.target.name }}-${TAG}.bin"
          cp "${{ steps.find.outputs.bin }}" "$DEST"
          sha256sum "$DEST" | awk '{print $1}' > "${DEST}.sha256"
          echo "ASSET_BIN=$DEST"          >> $GITHUB_ENV
          echo "ASSET_SHA=${DEST}.sha256" >> $GITHUB_ENV

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_BIN }}
            ${{ env.ASSET_SHA }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
